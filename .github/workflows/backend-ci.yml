name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: world_skills_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_skills_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/world_skills_test
      MOCK_DATABASE: "true"
      USE_NULL_POOL: "true"
      SECRET_KEY: ci-secret
      AUDIT_HMAC_SECRET: ci-audit-secret
      STORAGE_ROOT: /tmp/scms-test-storage
      COVERAGE_FAIL_UNDER: "40"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --group test --group lint
      - name: Lint
        run: uv run ruff check app pytest_tests
      - name: Test with coverage
        run: bash app/scripts/test.sh

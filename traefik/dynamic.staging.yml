# File-provider routes for world-skills (avoids duplicate routers vs compose labels).
# One Host per router so Let's Encrypt can issue when only some DNS records exist.
# (Bundling jamesyin + ctvet in one Host() OR rule fails ACME entirely if either NXDOMAIN.)
# jamesyin.com and ctvet.gov.gh hosts are both active (DNS A records point at the staging VM).
# If ctvet DNS is removed, drop those routers (see dynamic.staging.ctvet.snippet.yml) before
# recreating Traefik so ACME does not fail for the remaining hosts.
http:
  routers:
    worldskills-frontend-jamesyin:
      rule: "Host(`worldskills.jamesyin.com`)"
      entryPoints:
        - websecure
      service: worldskills-frontend-staging
      tls:
        certResolver: letsencrypt
      middlewares:
        - worldskills-security-headers

    worldskills-frontend-jamesyin-http:
      rule: "Host(`worldskills.jamesyin.com`)"
      entryPoints:
        - web
      service: worldskills-frontend-staging
      middlewares:
        - worldskills-security-headers

    worldskills-backend-jamesyin:
      rule: "Host(`worldskills-api.jamesyin.com`)"
      entryPoints:
        - websecure
      service: worldskills-backend-staging
      tls:
        certResolver: letsencrypt
      middlewares:
        - worldskills-security-headers

    worldskills-backend-jamesyin-http:
      rule: "Host(`worldskills-api.jamesyin.com`)"
      entryPoints:
        - web
      service: worldskills-backend-staging
      middlewares:
        - worldskills-security-headers

    worldskills-frontend-ctvet:
      rule: "Host(`worldskills.ctvet.gov.gh`)"
      entryPoints:
        - websecure
      service: worldskills-frontend-staging
      tls:
        certResolver: letsencrypt
      middlewares:
        - worldskills-security-headers

    worldskills-frontend-ctvet-http:
      rule: "Host(`worldskills.ctvet.gov.gh`)"
      entryPoints:
        - web
      service: worldskills-frontend-staging
      middlewares:
        - worldskills-security-headers

    worldskills-backend-ctvet:
      rule: "Host(`worldskills-api.ctvet.gov.gh`)"
      entryPoints:
        - websecure
      service: worldskills-backend-staging
      tls:
        certResolver: letsencrypt
      middlewares:
        - worldskills-security-headers

    worldskills-backend-ctvet-http:
      rule: "Host(`worldskills-api.ctvet.gov.gh`)"
      entryPoints:
        - web
      service: worldskills-backend-staging
      middlewares:
        - worldskills-security-headers

  services:
    worldskills-frontend-staging:
      loadBalancer:
        servers:
          - url: "http://world-skills-frontend-staging:3001"

    worldskills-backend-staging:
      loadBalancer:
        servers:
          - url: "http://world-skills-backend-staging:80"

  middlewares:
    worldskills-security-headers:
      headers:
        frameDeny: true
        sslRedirect: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        contentSecurityPolicy: "upgrade-insecure-requests; block-all-mixed-content"
        customResponseHeaders:
          Content-Security-Policy: "upgrade-insecure-requests; block-all-mixed-content"

tls:
  options:
    default:
      minVersion: "VersionTLS12"
